<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="틀린 문제와 풀이 상황을 기록하는 오답 등록 화면"
    />
    <title>오답 탐정 | 오답 등록</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <div class="brand-mark" aria-hidden="true">?</div>
        <div>
          <p class="eyebrow">나의 학습 기록</p>
          <h1>오답 탐정</h1>
          <p class="intro">틀린 이유를 기록하고, 다음에 공부할 방향을 찾아보세요.</p>
        </div>
        <span class="step-badge">1단계 · 오답 등록</span>
      </header>

      <section class="progress" aria-label="서비스 진행 단계">
        <div class="progress-item active"><span>1</span>오답 입력</div>
        <div class="progress-line"></div>
        <div class="progress-item"><span>2</span>원인 분석</div>
        <div class="progress-line"></div>
        <div class="progress-item"><span>3</span>문제 추천</div>
      </section>

      <div class="content-grid">
        <form id="wrong-answer-form" class="form-card">
          <div class="section-heading">
            <div>
              <p class="section-number">01</p>
              <h2>틀린 문제를 등록해 주세요</h2>
            </div>
            <p><span class="required-dot">●</span> 필수 입력</p>
          </div>

          <div class="field-row">
            <label class="field">
              <span>과목 <b aria-hidden="true">*</b></span>
              <select id="subject" required>
                <option value="">과목 선택</option>
                <option>수학</option>
                <option>과학</option>
                <option>정보</option>
                <option>영어</option>
                <option>기타</option>
              </select>
            </label>

            <label class="field">
              <span>단원 <b aria-hidden="true">*</b></span>
              <input id="unit" type="text" placeholder="예: 이차방정식" required />
            </label>
          </div>

          <label class="field">
            <span>문제 유형 <b aria-hidden="true">*</b></span>
            <input id="problem-type" type="text" placeholder="예: 계산형, 그래프 해석, 서술형" required />
          </label>

          <label class="upload-zone" for="problem-image">
            <input id="problem-image" type="file" accept="image/*" />
            <span class="upload-icon" aria-hidden="true">＋</span>
            <strong id="upload-title">문제 이미지 추가</strong>
            <small id="upload-help">사진을 선택하거나 촬영해 주세요 (선택)</small>
          </label>

          <div class="field-row">
            <label class="field">
              <span>내가 쓴 답 <b aria-hidden="true">*</b></span>
              <textarea id="user-answer" rows="3" placeholder="내가 작성한 답이나 풀이" required></textarea>
            </label>

            <label class="field">
              <span>정답 <b aria-hidden="true">*</b></span>
              <textarea id="correct-answer" rows="3" placeholder="문제의 정답" required></textarea>
            </label>
          </div>

          <fieldset class="situation-fieldset">
            <legend>문제를 풀 때 어떤 상황이었나요? <b aria-hidden="true">*</b></legend>
            <div class="choice-grid">
              <label class="choice"><input type="radio" name="situation" value="개념이 기억나지 않음" required /><span>개념이 기억나지 않았어요</span></label>
              <label class="choice"><input type="radio" name="situation" value="계산 실수" /><span>계산에서 실수했어요</span></label>
              <label class="choice"><input type="radio" name="situation" value="조건을 놓침" /><span>문제의 조건을 놓쳤어요</span></label>
              <label class="choice"><input type="radio" name="situation" value="풀이 방법을 모름" /><span>풀이 방법을 몰랐어요</span></label>
              <label class="choice"><input type="radio" name="situation" value="풀이 누락" /><span>풀이를 끝까지 쓰지 못했어요</span></label>
              <label class="choice"><input type="radio" name="situation" value="기타" /><span>기타</span></label>
            </div>
          </fieldset>

          <button class="primary-button" type="submit">오답 분석하기 <span aria-hidden="true">→</span></button>
        </form>

        <aside class="side-panel">
          <div class="tip-card">
            <p class="tip-label">기록 TIP</p>
            <h2>정확하게 적을수록<br />분석이 쉬워져요.</h2>
            <ul>
              <li>단원과 문제 유형을 구체적으로 적기</li>
              <li>내 답과 정답을 모두 입력하기</li>
              <li>풀 당시 상황을 솔직하게 선택하기</li>
            </ul>
          </div>

          <section id="result-card" class="result-card" aria-live="polite" hidden>
            <p class="section-number">입력 완료</p>
            <h2>오답 정보가 등록됐어요</h2>
            <dl id="result-list"></dl>
            <p class="next-note">다음 회차에는 이 정보를 이용해 오답 원인을 분석합니다.</p>
          </section>
        </aside>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
